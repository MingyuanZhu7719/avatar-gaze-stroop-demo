name: Portable C# regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Run installed-compiler discovery regression
        run: python scripts/test_unity_tools.py
      - name: Compile and run portable regression
        run: dotnet run --project AvatarStroop.Regression.csproj --configuration Release
      - name: Compile separate development owner console
        run: dotnet build AvatarStroop.OwnerConsole.csproj --configuration Release
      - name: Compile Windows Framework desktop preview owner window
        if: runner.os == 'Windows'
        run: dotnet build AvatarStroop.DesktopPreview.csproj --configuration Release
      - name: Compile Quest Link preview owner window
        if: runner.os == 'Windows'
        run: dotnet build AvatarStroop.DesktopPreview.csproj --configuration Release -p:DefineConstants=QUEST_PREVIEW_LAUNCHER
      - name: Run preview IPC regression on Windows Framework CLR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet build AvatarStroop.FrameworkPreviewSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/dotnet/AvatarStroop.FrameworkPreviewSmoke/Release/net48/AvatarStroop.FrameworkPreviewSmoke.exe
          exit $LASTEXITCODE
      - name: Run independent participant and operator simulators
        run: python scripts/integration.py --dotnet
