<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1870" viewBox="0 0 1440 1870" role="img" aria-labelledby="title desc">
<title id="title">Dual-headset automatic and live WoZ control architecture</title><desc id="desc">Conceptual requirements, not an implemented or validated system. Two VIVE Pro Eye headsets, two computers and two applications are confirmed roles. The participant application and computer display Stroop and the same avatar to the participant VIVE Pro Eye. The separate operator capture application and computer acquire actual operator head rotation and eye gaze from the operator VIVE Pro Eye, then transmit samples in real time to the participant application for reception and mapping. The automatic program source is local to the participant application. Both sources share the presentation interface, experimental flow and logging, not a guaranteed trajectory implementation. The avatar body stays fixed; body translation or pose, hands and voice are outside scope. Operator eye gaze is control input. Participant gaze is a distinct measurement stream from the participant VIVE Pro Eye, with acquisition and calibration still to verify. Operator-PC specifications, SDK/runtime, protocol and network details, clock synchronization and offset/drift, end-to-end latency, packet loss/order, tracking validity and fail-safe handling remain unvalidated; no silent automatic fallback.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#718198"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#edf0f4"/><path d="M -2 2 L 2 -2 M 0 8 L 8 0 M 6 10 L 10 6" stroke="#c0c9d4" stroke-width="1.5"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:700}.sub{font-size:21px;fill:#4f6178}.label{font-size:24px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#4f6178}.control{fill:#edf4fc;stroke:#2260a9;stroke-width:1.5}.measure{fill:#edf8f6;stroke:#087b79;stroke-width:1.5}.audit{fill:#f4f6f8;stroke:#718198;stroke-width:1.5}.pending{fill:#fff8e9;stroke:#a46c00;stroke-width:1.5;stroke-dasharray:7 5}.edge{fill:none;stroke:#718198;stroke-width:2;marker-end:url(#arrow)}.line{fill:none;stroke:#718198;stroke-width:2}</style>
<rect width="1440" height="1870" fill="white"/>

<text x="60" y="52" text-anchor="start" class="title"><tspan x="60" dy="0">Two computers, two VIVE Pro Eye headsets, one avatar</tspan></text>
<text x="60" y="88" text-anchor="start" class="sub"><tspan x="60" dy="0">Two applications • Operator capture app/PC → real-time link → participant app/PC • Integration unvalidated</tspan></text>
<rect x="60" y="130" width="840" height="140" rx="12" class="control"/>
<text x="84" y="167" text-anchor="start" class="label"><tspan x="84" dy="0">Locked block configuration and active clock</tspan></text>
<text x="84" y="202" text-anchor="start" class="body"><tspan x="84" dy="0">A–D • control source/mode • list/seed • initial B target</tspan><tspan x="84" dy="34">B rule: 3.0 s dwell + 0.5 s turn; planned cycle 7.0 s</tspan></text>
<rect x="950" y="130" width="430" height="140" rx="12" class="measure"/>
<text x="974" y="167" text-anchor="start" class="label"><tspan x="974" dy="0">Always-available stop</tspan></text>
<text x="974" y="202" text-anchor="start" class="body"><tspan x="974" dy="0">Hide word and avatar.</tspan><tspan x="974" dy="34">Freeze task and gaze clocks.</tspan></text>
<text x="480" y="310" text-anchor="middle" class="small"><tspan x="480" dy="0">Select and lock one control source for each block</tspan></text>
<rect x="60" y="350" width="380" height="170" rx="12" class="control"/>
<text x="84" y="387" text-anchor="start" class="label"><tspan x="84" dy="0">Participant app / PC</tspan></text>
<text x="84" y="427" text-anchor="start" class="body"><tspan x="84" dy="0">Automatic program source</tspan><tspan x="84" dy="32">Reference head + eye motion</tspan><tspan x="84" dy="32">B planned cycle: 7.0 s</tspan></text>
<rect x="520" y="350" width="380" height="170" rx="12" class="control"/>
<text x="544" y="387" text-anchor="start" class="label"><tspan x="544" dy="0">Operator app / PC</tspan></text>
<text x="544" y="427" text-anchor="start" class="body"><tspan x="544" dy="0">Separate VIVE Pro Eye</tspan><tspan x="544" dy="32">Actual head rotation + eye gaze</tspan><tspan x="544" dy="32">Own capture app + computer</tspan></text>
<rect x="520" y="585" width="380" height="200" rx="12" class="control"/>
<text x="544" y="622" text-anchor="start" class="label"><tspan x="544" dy="0">Real-time operator-PC</tspan><tspan x="544" dy="30">to participant-PC link</tspan></text>
<text x="544" y="690" text-anchor="start" class="body"><tspan x="544" dy="0">Capture → transmit → receive</tspan><tspan x="544" dy="32">Participant app maps live data</tspan><tspan x="544" dy="32">SDK / protocol still unchosen</tspan></text>
<rect x="950" y="350" width="430" height="435" rx="12" class="pending"/>
<text x="974" y="391" text-anchor="start" class="label"><tspan x="974" dy="0">Still to design and verify</tspan></text>
<text x="974" y="437" text-anchor="start" class="body"><tspan x="974" dy="0">Operator-PC details; SDK</tspan><tspan x="974" dy="40">Protocol / network details</tspan><tspan x="974" dy="40">Clock alignment: offset + drift</tspan><tspan x="974" dy="40">End-to-end latency</tspan><tspan x="974" dy="40">Packet loss / out-of-order data</tspan><tspan x="974" dy="40">Tracking validity and stale input</tspan><tspan x="974" dy="40">Fail-safe policy and recovery</tspan><tspan x="974" dy="40">No silent switch to automatic</tspan></text>
<rect x="60" y="865" width="840" height="210" rx="12" class="control"/>
<text x="84" y="907" text-anchor="start" class="label"><tspan x="84" dy="0">Participant app: shared avatar interface</tspan></text>
<text x="84" y="947" text-anchor="start" class="body"><tspan x="84" dy="0">Local automatic poses OR received live operator head/eye input.</tspan><tspan x="84" dy="34">Share task flow and logs; do not force identical trajectories.</tspan><tspan x="84" dy="34">Head rotation + eye gaze only. Avatar body stays fixed.</tspan><tspan x="84" dy="34">No body translation/pose, hands, or voice.</tspan></text>
<rect x="950" y="865" width="430" height="210" rx="12" class="measure"/>
<text x="974" y="907" text-anchor="start" class="label"><tspan x="974" dy="0">Participant VIVE Pro Eye</tspan></text>
<text x="974" y="947" text-anchor="start" class="body"><tspan x="974" dy="0">Participant computer + application</tspan><tspan x="974" dy="34">Stroop + same avatar display</tspan><tspan x="974" dy="34">Connection and capture unverified.</tspan></text>
<rect x="60" y="1170" width="840" height="440" rx="12" class="audit"/>
<text x="84" y="1212" text-anchor="start" class="label"><tspan x="84" dy="0">Common audit record: required provenance and timing</tspan></text>
<text x="84" y="1260" text-anchor="start" class="body"><tspan x="84" dy="0">Source / mode / operator; session, block, trial and segment IDs</tspan><tspan x="84" dy="39">Operator head-rotation and eye-gaze samples; tracking validity</tspan><tspan x="84" dy="39">Source-capture, receive and render timestamps + definitions</tspan><tspan x="84" dy="39">Clock synchronization, measured offsets and drift</tspan><tspan x="84" dy="39">End-to-end latency, packet loss and out-of-order delivery</tspan><tspan x="84" dy="39">Mapped / rendered head and eyes; exposure and timing deviations</tspan><tspan x="84" dy="39">Failure state, policy, stops, pauses and recovery events</tspan><tspan x="84" dy="39">Retain actual live data; no silent automatic substitution.</tspan></text>
<rect x="950" y="1170" width="430" height="170" rx="12" class="measure"/>
<text x="974" y="1212" text-anchor="start" class="label"><tspan x="974" dy="0">Participant task + ratings</tspan></text>
<text x="974" y="1258" text-anchor="start" class="body"><tspan x="974" dy="0">First valid new press; RT + accuracy</tspan><tspan x="974" dy="34">Five separate post-block items</tspan></text>
<rect x="950" y="1400" width="430" height="210" rx="12" class="measure"/>
<text x="974" y="1438" text-anchor="start" class="label"><tspan x="974" dy="0">Participant gaze</tspan><tspan x="974" dy="32">Independent measurement</tspan></text>
<text x="974" y="1515" text-anchor="start" class="body"><tspan x="974" dy="0">Own VIVE Pro Eye gaze stream</tspan><tspan x="974" dy="34">Capture / calibration to verify</tspan><tspan x="974" dy="34">Never substitute operator gaze</tspan></text>
<path d="M 250 270 V 350" class="edge" />
<path d="M 710 270 V 350" class="edge" />
<path d="M 710 520 V 585" class="edge" />
<path d="M 250 520 V 865" class="edge" />
<path d="M 710 785 V 865" class="edge" />
<path d="M 900 970 H 950" class="edge" />
<path d="M 480 1075 V 1170" class="edge" />
<text x="496" y="1134" text-anchor="start" class="small"><tspan x="496" dy="0">Avatar states + event times</tspan></text>
<path d="M 900 700 H 925 V 1135 H 870 V 1170" class="edge" />
<path d="M 950 1255 H 900" class="edge" />
<path d="M 950 1515 H 900" class="edge" />
<path d="M 950 200 H 900" class="edge" stroke-dasharray="7 5"/>
<path d="M 1380 200 H 1405 V 825 H 1165 V 865" class="edge" stroke-dasharray="7 5"/>
<rect x="60" y="1660" width="1320" height="150" rx="12" class="audit"/>
<text x="84" y="1702" text-anchor="start" class="label"><tspan x="84" dy="0">Keep the two gaze streams distinct</tspan></text>
<text x="84" y="1747" text-anchor="start" class="body"><tspan x="84" dy="0">Operator head rotation + eye gaze are control inputs in live WoZ.</tspan><tspan x="84" dy="36">Participant gaze is separate VIVE Pro Eye measurement; participant responses and gaze must not select targets.</tspan></text>
<text x="60" y="1844" text-anchor="start" class="small"><tspan x="60" dy="0">No claim of working capture, synchronization, transport, device compatibility or fail-safe behavior is made here.</tspan></text>
</svg>

