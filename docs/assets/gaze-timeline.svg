<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
<title id="title">Condition B planned seven-second timing: automatic reference and live WoZ rule</title><desc id="desc">The proportional bar is planned timing, not a measured live WoZ trace. Participant-directed dwell is planned from zero to three seconds, then a half-second turn, task-directed dwell from three and a half to six and a half seconds, then a half-second return. This is the automatic reference and the rule for the live operator to follow. Live WoZ maps actual operator head rotation and eye gaze; actual departures are recorded, not forced to match automatic motion or silently replaced. Head and eyes share onset and duration only in the automatic reference. The avatar body remains fixed in both modes; the initial target is counterbalanced and pauses freeze the active clock.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#718198"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#edf0f4"/><path d="M -2 2 L 2 -2 M 0 8 L 8 0 M 6 10 L 10 6" stroke="#c0c9d4" stroke-width="1.5"/></pattern></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:700}.sub{font-size:21px;fill:#4f6178}.label{font-size:24px;font-weight:700}.body{font-size:22px}.small{font-size:20px;fill:#4f6178}.control{fill:#edf4fc;stroke:#2260a9;stroke-width:1.5}.measure{fill:#edf8f6;stroke:#087b79;stroke-width:1.5}.audit{fill:#f4f6f8;stroke:#718198;stroke-width:1.5}.pending{fill:#fff8e9;stroke:#a46c00;stroke-width:1.5;stroke-dasharray:7 5}.edge{fill:none;stroke:#718198;stroke-width:2;marker-end:url(#arrow)}.line{fill:none;stroke:#718198;stroke-width:2}.body{font-size:20px}.label{font-size:23px}.small{font-size:18px}.sub{font-size:20px}</style>
<rect width="1100" height="850" fill="white"/>

<text x="50" y="48" text-anchor="start" class="title"><tspan x="50" dy="0">Condition B: planned gaze timing</tspan></text>
<text x="50" y="82" text-anchor="start" class="sub"><tspan x="50" dy="0">Automatic reference and operator timing rule • Actual live WoZ motion may depart</tspan></text>
<rect x="80" y="175" width="390" height="105" fill="#edf4fc" stroke="#2260a9" stroke-width="1.5"/>
<rect x="470" y="175" width="65" height="105" fill="url(#hatch)" stroke="#718198" stroke-width="1.5"/>
<rect x="535" y="175" width="390" height="105" fill="#edf8f6" stroke="#087b79" stroke-width="1.5"/>
<rect x="925" y="175" width="65" height="105" fill="url(#hatch)" stroke="#718198" stroke-width="1.5"/>
<text x="275" y="216" text-anchor="middle" class="label"><tspan x="275" dy="0">Participant directed</tspan></text>
<text x="275" y="248" text-anchor="middle" class="body"><tspan x="275" dy="0">3.0 s settled dwell</tspan></text>
<text x="730" y="216" text-anchor="middle" class="label"><tspan x="730" dy="0">Task directed</tspan></text>
<text x="730" y="248" text-anchor="middle" class="body"><tspan x="730" dy="0">3.0 s settled dwell</tspan></text>
<text x="502.5" y="141" text-anchor="middle" class="small"><tspan x="502.5" dy="0">Turn</tspan><tspan x="502.5" dy="22">0.5 s</tspan></text>
<text x="957.5" y="141" text-anchor="middle" class="small"><tspan x="957.5" dy="0">Turn</tspan><tspan x="957.5" dy="22">0.5 s</tspan></text>
<path d="M 80 280 V 295" class="line" />
<text x="80" y="323" text-anchor="middle" class="body"><tspan x="80" dy="0">0.0</tspan></text>
<path d="M 470 280 V 295" class="line" />
<text x="470" y="323" text-anchor="middle" class="body"><tspan x="470" dy="0">3.0</tspan></text>
<path d="M 535 280 V 295" class="line" />
<text x="535" y="323" text-anchor="middle" class="body"><tspan x="535" dy="0">3.5</tspan></text>
<path d="M 925 280 V 295" class="line" />
<text x="925" y="323" text-anchor="middle" class="body"><tspan x="925" dy="0">6.5</tspan></text>
<path d="M 990 280 V 295" class="line" />
<text x="990" y="323" text-anchor="middle" class="body"><tspan x="990" dy="0">7.0</tspan></text>
<text x="535" y="355" text-anchor="middle" class="small"><tspan x="535" dy="0">Planned active-block time in seconds</tspan></text>
<path d="M 990 280 H 1030 V 395 H 50 V 228 H 80" class="edge" />
<text x="550" y="385" text-anchor="middle" class="label"><tspan x="550" dy="0">Repeat the planned reference cycle</tspan></text>
<rect x="60" y="435" width="470" height="155" rx="12" class="control"/>
<text x="80" y="469" text-anchor="start" class="label"><tspan x="80" dy="0">Automatic source</tspan></text>
<text x="80" y="509" text-anchor="start" class="body"><tspan x="80" dy="0">Program source in participant app.</tspan><tspan x="80" dy="29">Head + eyes share onset and duration.</tspan><tspan x="80" dy="29">Begin with the first main-trial onset.</tspan></text>
<rect x="560" y="435" width="480" height="155" rx="12" class="measure"/>
<text x="580" y="469" text-anchor="start" class="label"><tspan x="580" dy="0">Live operator source</tspan></text>
<text x="580" y="509" text-anchor="start" class="body"><tspan x="580" dy="0">VIVE Pro Eye + separate PC and app.</tspan><tspan x="580" dy="29">Actual head rotation + eye gaze drive avatar.</tspan><tspan x="580" dy="29">Follow this rule; log all live deviations.</tspan></text>
<rect x="60" y="625" width="980" height="145" rx="12" class="audit"/>
<text x="80" y="660" text-anchor="start" class="label"><tspan x="80" dy="0">Preserve actual live motion and its timing</tspan></text>
<text x="80" y="699" text-anchor="start" class="body"><tspan x="80" dy="0">Pause freezes the active clock; log source, receive and render times.</tspan><tspan x="80" dy="28">Do not retime live input or silently replace it with automatic poses.</tspan><tspan x="80" dy="28">Initial target is counterbalanced; reverse target labels for task-first.</tspan></text>
<text x="60" y="809" text-anchor="start" class="small"><tspan x="60" dy="0">Body fixed in both modes. Transitions are separate states; 7.0 s is a planned rule, not guaranteed human timing.</tspan></text>
</svg>

